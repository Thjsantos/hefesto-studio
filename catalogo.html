<script>
  let cat = (location.hash || "#todos").slice(1), q = "";
  const filters = document.getElementById("filters");
  const tabs = { todos:"Todos", ...Object.fromEntries(Object.entries(CATEGORIES).filter(([k])=>PRODUCTS.some(p=>p.cat===k || (k==="pronta" && p.pronta))).map(([k,c])=>[k,c.name])) };
  filters.innerHTML = Object.entries(tabs).map(([k,n])=>`<button data-c="${k}">${n}</button>`).join("")
    + `<input type="search" id="q" placeholder="Buscar peça…">`;
  function render(){
    if(!tabs[cat]) cat = "todos";
    filters.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.c===cat));
    const list = PRODUCTS.filter(p => (cat==="todos" || p.cat===cat || (cat==="pronta" && p.pronta))
      && p.name.toLowerCase().includes(q));
    document.getElementById("grid").innerHTML = list.map(cardHTML).join("");
    document.getElementById("empty").style.display = list.length ? "none" : "block";
  }
  filters.addEventListener("click", e => { const b = e.target.closest("button"); if(b){ cat=b.dataset.c; history.replaceState(null,"","#"+cat); render(); } });
  document.getElementById("q").addEventListener("input", e => { q = e.target.value.toLowerCase(); render(); });
  window.addEventListener("hashchange", () => { cat = location.hash.slice(1); render(); });
  document.getElementById("wpp-float").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Olá! Vim pelo catálogo.")}`;
  document.getElementById("y").textContent = new Date().getFullYear();
  render();
</script>
