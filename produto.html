<script src="products.js"></script>
<script>
productsReady.then(() => {
  const p = PRODUCTS.find(x => x.id === new URLSearchParams(location.search).get("id"));
  if (!p) document.getElementById("empty").style.display = "block";
  else {
    const c = CATEGORIES[p.cat];
    const imgs = [p.img, p.img2, ...(p.gallery || [])].filter(Boolean);
    const rows = [["Categoria", c.name], ["Modelo", p.patreon], ...Object.entries(p.specs || {})].filter(r => r[1]);
    let sel = 0; // first scale selected by default
    document.title = `${p.name} – Hefesto Studio`;
    document.getElementById("product").innerHTML = `
      <div class="detail">
        <div class="gallery">
          <div class="main">${imgs.length ? `<img id="main-img" src="${imgs[0]}" alt="${p.name}">` : c.icon}</div>
          ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((s,i) => `<button data-i="${i}" class="${i?"":"on"}" aria-label="Foto ${i+1}"><img src="${s}" alt=""></button>`).join("")}</div>` : ""}
        </div>
        <div class="summary">
          <small>${c.name}${p.patreon ? ` · ${p.patreon}` : ""}</small>
          <h1>${p.name}</h1>
          <div class="price" id="price">${priceHTML(p)}</div>
          ${p.scales ? `<div class="scales"><span>Escala</span>${p.scales.map((s,i) => `<button data-s="${i}">${s.name}</button>`).join("")}</div>` : ""}
          ${p.desc ? `<p class="desc">${p.desc}</p>` : ""}
          ${p.features ? `<ul class="desc">${p.features.map(d => `<li>${d}</li>`).join("")}</ul>` : ""}
          <table class="specs">${rows.map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}${p.scales ? `<tr><th>Altura aproximada</th><td id="height"></td></tr>` : ""}</table>
          <a class="btn" id="quote" target="_blank" rel="noopener">Pedir orçamento</a>
          <p class="note">O valor varia conforme a escala escolhida. Valor final, prazo e frete são confirmados direto com o estúdio pelo WhatsApp. Envio para todo o Brasil, com embalagem reforçada.</p>
        </div>
      </div>`;
    function update(){
      const s = p.scales && p.scales[sel];
      document.getElementById("price").innerHTML = s ? brl(s.price) : priceHTML(p);
      document.querySelectorAll(".scales button").forEach(b => b.classList.toggle("on", Number(b.dataset.s) === sel));
      if (p.scales) document.getElementById("height").textContent = s ? s.height : p.scales.map(x => `${x.height} (${x.name})`).join(" · ");
      const what = s ? `${p.name}, escala ${s.name} (${brl(s.price)})` : `${p.name} (${priceText(p)})`;
      document.getElementById("quote").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Olá! Gostaria de um orçamento para: ${what}.`)}`;
    }
    document.querySelectorAll(".scales button").forEach(b => b.onclick = () => { sel = Number(b.dataset.s); update(); });
    update();
    document.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => {
      document.getElementById("main-img").src = imgs[b.dataset.i];
      document.querySelectorAll(".thumbs button").forEach(x => x.classList.toggle("on", x === b));
    });
  }
  document.getElementById("wpp-float").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Olá! Vim pelo catálogo.")}`;
  document.getElementById("y").textContent = new Date().getFullYear();
});
</script>
</body>
</html>
